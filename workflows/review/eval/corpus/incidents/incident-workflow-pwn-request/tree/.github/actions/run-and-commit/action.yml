name: "Run a Command and Commit the Changes"
description: "Run a command and commit the changes"

# The outputs this action expects.
inputs:
    working-directory:
        required: false
        description: "The directory to run the commands in"
    run:
        required: true
        description: "The command to run"
    comment-message:
        required: false
        description: "The message to post as a comment on the PR, with the output of the command."
    include-untracked:
        required: false
        description: "Whether to include untracked files when checking for changes"
        default: "false"

# The steps this action runs.
runs:
    using: "composite"
    steps:
        - name: Run the Command
          id: command
          shell: bash
          if: always()
          working-directory: ${{ inputs.working-directory }}
          run: |
              # Run the command and capture the output

              # Start a collapsible group for the command output
              echo "::group::Running: ${{ inputs.run }}"

              # Duplicate stdout to fd 3. This will allow us to both capture
              # the stdout for our `body` variable, and still have it go to
              # the console.
              exec 3>&1

              # Run the command, ensuring that stdout and stderr still go
              # to the console by using `tee` and the new fd 3 for stdout.
              body="$((${{ inputs.run }}) | tee >(cat >&3))"

              # Close the extra fd 3 that we opened.
              exec 3>&-

              # End the group
              echo "::endgroup::"

              # Encode the result, following:
              # https://github.com/marketplace/actions/create-or-update-comment#setting-the-comment-body-from-a-file
              {
                echo "body<<EOF"
                echo "$body"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"

        - name: Commit the Changes
          id: commit
          shell: bash
          if: always()
          run: |
              # Check for changes, conditionally including untracked files
              if [[ "${{ inputs.include-untracked }}" == "true" ]]; then
                # Include untracked files in the status check
                GIT_STATUS=$(git status -s)
              else
                # Only check tracked files (default behavior)
                GIT_STATUS=$(git status -s -uno)
              fi

              # If there are changes, commit them
              if [[ -n "$GIT_STATUS" ]]; then
                echo "HAS_CHANGES=true" >> $GITHUB_OUTPUT
                git config user.name "Khan Actions Bot"
                git config user.email "khan-actions-bot@khanacademy.org"
                git add .
                git commit -am "[automated] Results of '${{ inputs.run }}'"
              fi

        - name: Disallow changes in the merge queue
          if: steps.commit.outputs.HAS_CHANGES == 'true' && github.event_name == 'merge_group'
          shell: bash
          run: |
              echo "Error: Changes are not allowed in the merge queue. Please run the autofix manually and commit the changes."
              exit 1

        - name: Post Comment
          if: steps.commit.outputs.HAS_CHANGES == 'true' && inputs.comment-message != ''
          uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043
          with:
              issue-number: ${{ github.event.pull_request.number }}
              body: |
                  ${{ inputs.comment-message }}
                  ```
                  ${{ steps.command.outputs.body }}
                  ```
