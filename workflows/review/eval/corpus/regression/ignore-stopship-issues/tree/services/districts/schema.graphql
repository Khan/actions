extend type Query {
    """The classroom corresponding to the given Clever ID, if any."""
    classroomByCleverId(cleverId: ID!): Classroom

    """GraphQL query type for retrieving a single UserDistrictInfo."""
    userDistrictInfo(uuid: ID!, includeDeleted: Boolean): UserDistrictInfo

    """All UDIs that are associated with an email or roster ID.
    (currently clever or classlink rosterSource)
    """
    userDistrictInfos(email: String, rosterID: String): [UserDistrictInfo]

    """All UMIs that are associated with an email."""
    userMetaInfos(email: String!): [UserMetaInfo!]!

    """Returns all UDIs with matching classlink_ids
    that also satisfy the includeDeleted and activeOnly
    params of each matching UDI.
    UDIs are marked deleted when they no longer appear in the roster
    Usually you never want to include deleted UDIs. These are retained
    for record keeping and future un-deletion if they re-appear in the
    district roster. A UDI can be Deleted AND active.
    Active UDIs are UDIs that have a Khan Academy account
    associated with them by kaid.
    Sometimes the caller will want only UDIs that have
    already been activated.
    includeDeleted - usually false, only true if you are looking
                     to undelete a UDI or understand it's history.
    activeOnly - if TRUE only UDIs that have been associated
                 with a Khan Academy account will be returned
                 (ie have /a Kaid).
    """
    classlinkUDIs(classlinkID: String!, includeDeleted: Boolean, activeOnly: Boolean): [UserDistrictInfo]

    """Returns true if the email is associated with UDI that is part of the Class."""
    isEmailInClass(email: String!, classCode: String!): EmailIsInClassResult!

    """GraphQL query for retrieving a single UserDistrictInfo for the email and classCode."""
    userDistrictInfoByEmailAndClassCode(email: String!, classCode: String!): UserDistrictInfoResult!

    """A single school by ID."""
    schoolById(schoolId: ID!): School!

    """GraphQL query for retrieving a single District by Id."""
    districtById(districtId: ID!): District!

