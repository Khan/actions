    """Flag indicating state of roster syncing"""
    rosterSyncingEnabled: Boolean!

    """Flag indicating whether activation emails should be sent to teachers when new teachers are added to  the district roster."""
    sendActivationEmails: Boolean!

    """Flag indicating whether KAD emails (e.g. monthly admin progress emails) should be sent for this district."""
    sendKADEmails: Boolean!

    """Flag indicating if district admins should be pulled from clever and rostered as admins."""
    rosterDistrictAdmins: Boolean!

    """Flag indicating if Discussions should be shown for the District."""
    showDiscussions: Boolean!

    """Flag indicating that all students in the district can share images to supported Khanmigo activities"""
    enableImageInput: Boolean!

    """All district schools visible to the current user sorted by name."""
    schools(administeredOnly: Boolean! = true): [School]!

    """Whether this is a test district. If not, this is real customer data!"""
    isTest: Boolean!

    """The product offerings available in this district."""
    offerings: [Offering]!

    """Whether this district has access to the MAP Accelerator product offering.
    Pass scopeToActor=true to check if the actor has access to the offering
    (i.e., if they administer at least one school in the district with the offering).
    """
    isKmapDistrict(scopeToActor: Boolean! = false): Boolean!

    """Whether classrooms in this district use the Khan Classroom experience, i.e. have classrooms
    accessible via https://classroom.khanacademy.org.
    """
    isKhanClassroomDistrict: Boolean!

    """Whether this district has access to the KAD product offering.
    Pass scopeToActor=true to check if the actor has access to the offering
    (i.e., if they administer at least one school in the district with the offering).
    """
    isK4dDistrict(scopeToActor: Boolean! = false): Boolean!

    """Whether this district has access to the KAD Self-Serve product offering.
    Pass scopeToActor=true to check if the actor has access to the offering
    (i.e., if they administer at least one school in the district with the offering).
    """
    hasKadSelfServe(scopeToActor: Boolean! = false): Boolean!

    """Whether this district has access to the KAD Trial product offering.
    Pass scopeToActor=true to check if the actor has access to the offering
    (i.e., if they administer at least one school in the district with the offering).
    """
    hasKadTrial(scopeToActor: Boolean! = false): Boolean!

    """Whether this district has access to the KAD Assessments offering.
    Pass scopeToActor=true to check if the actor has access to the offering
    (i.e., if they administer at least one school in the district with the offering).
    """
    hasAssessments(scopeToActor: Boolean! = false): Boolean!

    """Whether this district has access to the KAD "Assessments Pilots" offering.
    Pass scopeToActor=true to check if the actor has access to the offering
    (i.e., if they administer at least one school in the district with the offering).
    """
    hasAssessmentsPilots(scopeToActor: Boolean! = false): Boolean!

    """Whether this district wants the district rostered teachers to be able to download the district teacher's guide."""
    downloadTeachersGuide: Boolean!

    """The unsorted list of district specific curriculum aligned courses if any."""
    curriculumAlignedCourses: [Course]

    """This district's last N roster jobs."""
    lastNRosterJobs(numJobs: Int!): [RosterJob!]

    """This district's last N khanmigo jobs."""
    lastNKhanmigoJobs(numJobs: Int!, includeDryRun: Boolean): [RosterJob!]

    """When this district was last rostered successfully."""
    lastRostered: DateTime

    """When this districts test results were last pulled successfully"""
    lastTestPull: DateTime

    """The first date this district is set to start activating.
    Once this is set we will auto activate any unactivated rostered teachers and admins.
    If this districts sends teacher and admin activation emails, emails
    will be sent to all teacher and admins on the first roster after the
    go live date.
    """
    goLiveDate: Date!

    """The date this district record was created."""
    createdAt: DateTime!

    """True if this district is no longer a customer and their data has been deleted."""
    isDowngraded: Boolean!

    """The date this district was downgraded and their data deleted."""
    deletedAt: DateTime

    """The language locale for this district"""
    kaLocale: String!

    """The start and end dates for a school year for this district"""
    schoolYearDates: DistrictSchoolYear

    """ True if the district should ignore enrollment Start/End Dates for this District """
    ignoreEnrollmentDates: Boolean!

    """The current school year start date based on the district's schoolYearDates field"""
    schoolYearStart: DateTime

     """The current school year end date based on the district's schoolYearDates field"""
    schoolYearEnd: DateTime

    """The next school year start date based on the district's schoolYearDates field"""
    nextSchoolYearStart: DateTime

    """The next school year end date based on the district's schoolYearDates field"""
    nextSchoolYearEnd: DateTime

    """ The region of this district. Adheres to ISO-3166. For example US Michigan would be: US-MI """
    region: String

    """ True if the District has enabled Khanmigo.
    Pass scopeToActor=true to check if the actor *administers*
    at least one school in the district with Khanmigo enabled.
    """
    hasKhanmigo(scopeToActor: Boolean! = false): Boolean!

    """ The district-wide preferences for khanmigo enrollment """
    khanmigoPreference: KhanmigoEnrollment!

    """ The district-wide preference for khanmigo nonstudent enrollment """
    khanmigoIncludeNonStudents: Boolean

    """ The district-wide preference for khanmigo student enrollment """
    khanmigoIncludeStudents: Boolean!

    """  The district-wide user licenses sold """
    khanmigoTotal: Int!

    """  The student user licenses sold """
    khanmigoStudents: Int!

     """  The teacher user licenses sold """
    khanmigoTeachers: Int!

     """  The admin user licenses sold """
    khanmigoAdmins: Int!

    """ The district-wide count of UDIs with khanmigo_should = true
    	The district-wide count of UDIs with khanmigo_should_have = true
    	This is the set of current UDIs (activated and not) that match the district khanmigo provisioning
    	rules set in devadmin and outlined in
    	https://docs.google.com/document/d/1-zk_r9I7GnkYWhlqUg2WvAYPTKAi7DxBk5qxC891uiA
    	"""
    khanmigoUDIsShould: Int!

    """ The district-wide count of UDIs with khanmigo_have = true
    	IE The total number of Khan Academy users who currently have khanmigo enabled
    	because of district provisioning.
    	A UDI will have khanmigo_status = true when khanmigo_should_have = true
    	and the UDI is activated.
    	This should correspond with isAIGuideEnabled for the user.
    	"""
    khanmigoUDIsHave: Int!

    """ The UDIs that have been explicitly included by the district. """
    khanmigoIncludedUsers: [UserDistrictInfo!]

    """ The UDIs that have been explicitly excluded by the district. """
    khanmigoExcludedUsers: [UserDistrictInfo!]

    """ The Khanmigo grade enrollment preference for this district """
    khanmigoGradeEnrollment: DistrictKhanmigoGrades

    """ The district-wide token capacity for khanmigo enrollment """
    khanmigoTokenCapacity: Int!

    """ The district-wide token usage for khanmigo enrollment """
    khanmigoTokenUsage: Int!

    """ When the district khanmigo enrollment, if any, should begin """
    khanmigoStart: DateTime

    """ When the district khanmigo enrollment, if any, should end """
    khanmigoEnd: DateTime

    """The meta-district or district that is the partnership this district
    belongs to. May be the same as this district itself.
    """
    partnership: AdminAggregate!

    """The ID of the parent of this district.  The parent is a meta-district.
    A district without a parent is the root of the partnership tree;
    in this case the tree is a simple 2-level (district > school) hierarchy.
    """
    parent: MetaDistrict

    """The ancestor meta-districts of this district in the partnership tree."""
    ancestors: [MetaDistrict!]!

    """The height of this district in the partnership tree. Is always 1."""
    levelHeight: Int!

    """The label of this district's level in the partnership tree in the partnership's language."""
    levelLabel: String!

    """The labels of each level in the tree rooted at this district.
    The index corresponds to the level height.
    i.e., treeLabels[0] is the label of the schools, and treeLabels[1] is the label of the districts.
    """
    treeLabels(kaLocale: String! = "en"): [LevelLabel!]!

    """The country this district belongs to."""
    countryCode: String!

	"""Coach types which are restricted to in-district student associations."""
	restrictedCoachTypes: [CoachType!]!

    """Option to turn off non-severe Khanmigo moderation email notifications
    to teachers.
    """
    onlySevereAIModeration: Boolean!

    """A list of incurred changes end users have made on a district"""
    districtAuditLogs: [DistrictAuditLog!]

    """True if the user administers this district"""
    isAdministered: Boolean!

    """Flag indicating that the district opted out of being part of research metrics"""
    researchOptOut: Boolean!

    """True if the district has LMS integration enabled."""
    hasLMSConnect: Boolean!

    """The Date when LMS integration sync should start."""
    lmsConnectStartDate: Date

    """LMS provider ID, for clever this is the clever ID"""
    lmsProviderId: String

    """The number of seats used by the district. Currently only used by students for a KADSS district."""
    kadssSeatsUsed: Int

    """The type of self serve organization. This is only set for KADSS districts."""
    selfServeOrgType: SelfServeOrganizationType

    """The locality (city/town/village) of the district address. Only set for KADSS districts."""
    locality: String

    """The street address of the district. Only set for KADSS districts."""
    street: String

    """The postal code of the district address. Only set for KADSS districts."""
    postalCode: String

    """ The district onboarding steps"""
    onboardingSteps: [DistrictOnboardingStep!]!

    """Structured onboarding info for the Next-Gen checklist."""
    onboardingInfo: DistrictOnboardingInfo

    """LMS syncing defaults for classrooms in the district."""
    lmsSyncType: DistrictLMSSyncType

    """The set of learning paths tests available to this district"""
    learningPathsTests: [LearningPathTest!]

    """The MOA (Memorandum of Agreement) governing this node — held here, or
    inherited from the nearest ancestor that holds one (closest parent wins).
    Null when no MOA exists at or above this node, or when the viewer doesn't
    administer the node holding it.
    """
    moa: Moa

    """The lifecycle state of the MOA governing this node (its own or the
    nearest ancestor's). Unlike moa, readable by any viewer of the node —
    NONE also distinguishes "no MOA anywhere above" from moa being null
    because its details are restricted.
    """
    moaState: MoaState!

    """True when the MOA governing this node is in good standing — the
    predicate the administer-tier access gate enforces (ACTIVE, WARN,
    EXTENDED, and NONE pass). Readable by any viewer, like moaState; reports
    the classification, not whether enforcement is switched on.
    """
    moaInGoodStanding: Boolean!

    """Server-driven badge for the governing MOA's state. Readable by any
    viewer, like moaState. DevAdmin-tier: the label is served in English and
    bypasses frontend i18n.
    """
