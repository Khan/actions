    """Name of the term this test was taken"""
    termName: String

    """Type of test example: Mathmatics"""
    measurementScale: String

    """Whether this test meets the criteria to be a growth event"""
    isGrowthMeasure: Boolean

    """Goal Data consitings for score data for 4 goal/strands for Math"""
    goalData: [GoalDatum]

    """The MAP growth test the tests results are from.
    Currently this is one of three tests:
    2-5/6+, Algebra 1 or Geometry.
    """
    mapTestKey: String
}

