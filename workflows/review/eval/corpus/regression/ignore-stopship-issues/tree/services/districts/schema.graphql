"""
A District or MetaDistrict. These form all the internal nodes in the partnership tree.
"""
union AdminAggregate = District | MetaDistrict

"""
A MetaDistrict or District or School. These form all the nodes in the partnership tree (including leaves, which are Schools).
"""
union AdminNode = MetaDistrict | District | School

"""
A hierarchy of districts.
"""
type MetaDistrict @key(fields: "id") {
    """The meta district ID aka the entity key name uuid."""
    id: ID!

    """The ID of the parent of this meta-district.
	The parent is another meta-district.
	A meta-district without a parent is the root of the partnership tree.
	"""
    parent: MetaDistrict

    """The administrative aggregates that this meta district contains.
    Pass administeredOnly true to only return admin aggregates that the
    user administers directly or indirectly (i.e., nodes to which the user
    has view-only access are not returned).
    """
    children(administeredOnly: Boolean! = false): [AdminAggregate!]!

    """Timestamp this MetaDistrict entity was created"""
    createdAt: DateTime!

    """Whether this is a test partnership/meta-district."""
    isTest: Boolean!

    """All administrative aggregates that are descendants of this meta district.
    Not returned in any particular order. Excludes the current meta district.
    Pass includeDeleted true to include soft-deleted district entities.
    Pass administeredOnly true to only return admin aggregates that the
    user administers directly or indirectly (i.e., nodes to which the user
    has view-only access are not returned).
    """
    descendants(administeredOnly: Boolean! = false, includeDeleted: Boolean! = false): [AdminAggregate!]!

    """The ancestor meta-districts of this meta-district in the partnership tree."""
    ancestors: [MetaDistrict!]!

    """The name of this meta district in its partnership's language."""
    name: String!

    """The label of this meta district's level in the partnership aggregation tree in its partnership's language."""
    levelLabel: String!

    """The height of this meta district's level in the partnership tree.
	Schools have a height of 0, Districts have a height of 1, and Meta-Districts can have any height > 1.
	"""
    levelHeight: Int!

    """The labels of each level in the tree rooted at this meta-district.
    The index corresponds to the level height.
    i.e., treeLabels[0] is the label of the schools, treeLabels[1] is the label of the districts,
    treeLabels[2] is the label of level 2 etc.
    """
    treeLabels(kaLocale: String! = "en"): [LevelLabel!]!

    """The country this meta-district belongs to."""
    countryCode: String!

    """Check the set of attributes on each descendant district and return the 'inferred' values.
    See documentation for MetaDistrictInferredAttributes for more details.
    Used in the devadmin view of the collection of partnerships to show the inferred attributes
    of the meta-district (a UI alert is shown if the attributes are not consistent).
    Excludes soft-deleted district entities.
    """
    inferredAttributes: MetaDistrictInferredAttributes

    """Is true if at least one sub-district has the KAD offering.
    Pass scopeToActor true to only return true if the actor *administers*
    a sub-district with the KAD offering.
