"""
Source of rostering when creating a district
"""
enum RosterSource {
  """OBSOLETE - Do not use or set."""
  NWEA_CLEVER
  """Rostered from Clever -
  rosterID will be the cleverID
  """
  CLEVER
  """Rostered from Classlink -
  rosterID will be the classlinkID
  """
  CLASSLINK
  """Rostered via the teacher-directed mechanism (source is BigQuery) -
  rosterID will be the externalID
  """
  TEACHER_DIRECTED
  """Rostered via holistic in product rostering. Currently only used for
  KAD trial districts.
  """
  HIPR
  """Unknown RosterSource -
  used for debugging
  """
  UNKNOWN
}

