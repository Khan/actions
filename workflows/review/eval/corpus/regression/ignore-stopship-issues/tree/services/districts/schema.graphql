"""
Khan district & teacher product offerings.

  - KMAP: The "MAP Accelerator" offering, which allows districts
    to import their class roster from NWEA, stay synced, and
    download MAP assessment scores.
  - KHAN_FOR_DISTRICTS: The "Khan for Districts" offering, which
    allows districts to import their class roster from Clever or
    other sources, stay synced, and see usage & performance
    reports for their schools and classes.
  - KHAN_CLASSROOM: The "Khan Classroom" offering, which specifies that
    this districts is using the new Khan Classroom experience.
  - ASSESSMENT: The "Assessments" offering, which specifies that
    this district has access to the Khan Academy Assessments product.
  - GRASSROOTS: The free product offering, available directly to
    teachers by default, even if they aren't registered with a
    customer district. All teachers have this offering, both
    district and non-district teachers. If you register a Khan
    Academy teacher account today, you'll receive this offering.
  - KAD_SELF_SERVE: The "Khan Academy Districts Self-Serve" offering, which
    allows districts to view and manage their district roster district
    on their Khan Academy admin dashboard.
  - KAD_TRIAL: The "Khan Academy Districts Trial" offering, which allows
    districts to try the Khan Academy Districts product offering where they
    can manage their admins and teachers in product.
"""
enum Offering {
    KMAP
    KHAN_FOR_DISTRICTS
    KHAN_CLASSROOM
    GRASSROOTS
    ASSESSMENT
    ASSESSMENTS_PILOTS
    KAD_SELF_SERVE
    KAD_TRIAL
}

"""
District represents a district that rosters for Kmap or Kad (akak K4d).
"""
type District @key(fields: "id") {
