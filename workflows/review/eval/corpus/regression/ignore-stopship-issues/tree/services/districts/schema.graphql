"""
CleverCoachRequests are a clever library specific entity.

When a clever library using teacher logs in via clever SSO we will
create all their synced classes and add all the students we can find
into those classes (see sync_clever_library.go)
CleverCoachRequests are used to represent the students in the teachers
class before those students have logged in and joined the class. This
allows us to show the teacher their pending students before they've
signed up.
Once the student has logged in we will delete the CleverCoachRequest
"""
type CleverCoachRequest {
  """The ID for the CleverCoachRequest"""
  id: ID

  """An identifier for the requested student
  This is set to be the student's first name and last initial and
  is populated from Clever API data
  """
  studentIdentifier: String

  """The Clever ID of the requested student"""
  studentCleverId: String!

  """The KAID of the requested student"""
  studentKaid: String @deprecated(reason: "add `student: User` if needed in the future")
}

