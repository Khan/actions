"""
The MOA (Memorandum of Agreement) governing an agreement node.

The values are atomically one node's record: the viewed node's own when it
holds an MOA (a node holds one when its own expiration date is set), otherwise
the nearest ancestor's — "closest parent wins". inheritedFrom names the holder
when it isn't the viewed node itself.
"""
type Moa {
    """The governing MOA's expiration date."""
    expirationDate: Date

    """The governing MOA's extension end date, when one is recorded."""
    extendedUntil: Date

    """The governing MOA's contact email(s). Empty when none are set."""
    contactEmails: [String!]!

    """The governing MOA's document link(s). Empty when none are set."""
    documentLinks: [String!]!

    """Null when this node holds the MOA itself; otherwise the ancestor
    meta-district whose MOA governs this node.
    """
    inheritedFrom: MetaDistrict
}

"""
The date-driven lifecycle state of a governing MOA, derived at read time.

Never stored: the state is a pure function of the governing expiration date.
The agreement is valid through its expiration date. Deliberately coarse —
the state is what a consumer acts on; finer urgency (exact days, reminder
cadence) belongs to the gated expiration date and to notification config,
never to this enum. Window widths are configuration; per-value docs
describe the current ones. Dates are compared at day granularity in UTC.
"""
enum MoaState {
    """No MOA exists on this node or any of its ancestors."""
    NONE

    """Before the warn window (currently more than 180 days out)."""
    ACTIVE

    """Inside the warn window (currently from 180 days out, through the
    expiration date itself)."""
    WARN

    """Past the expiration date, inside a recorded extension. The extension's
    end date becomes the agreement's end."""
    EXTENDED

    """Past the agreement's end (expiration date, or extension end when one
    is recorded), inside the suspension window (currently through the first
    anniversary of that end)."""
    SUSPENDED

    """Past the suspension window (currently beyond the first anniversary
    of the agreement's end)."""
    EXPIRED
}

"""
The urgency of a governing MOA's state, for badge rendering.

The set is closed: a new lifecycle state maps onto an existing level.
"""
enum MoaSeverity {
    """Nothing needs attention."""
    OK

    """Informational; nothing has lapsed."""
    NOTICE

    """Action needed before a deadline."""
    WARNING

    """The agreement has lapsed."""
    CRITICAL
}

"""
Server-driven badge content for a governing MOA's state.
"""
type MoaBadge @consumer(name: DEVADMIN) {
    """The urgency level; maps to a badge kind client-side."""
    severity: MoaSeverity!

    """Display label naming the state (English; devadmin-tier only)."""
    label: String!
}

