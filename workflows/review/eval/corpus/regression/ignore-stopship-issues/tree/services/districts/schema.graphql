}

"""
The publicly-available information about a classroom district info.

This data may be shown to unauthorized users as part of the join-by-class-code flow.
It is a subset of the ClassroomDistrictInfo type.
"""
type PublicClassroomDistrictInfo {
    """The ID of the classroom district info"""
    id: ID!

    """A list of possible email domains held by student UDIs of this CDI."""
    emailDomains: [String!]
}

extend type Classroom @key(fields: "descriptor") @replaces(name: "StudentList") {
    """A globally unique identifier for this classroom."""
    descriptor: String! @external

    """This is a district classroom with and both the teacher and at least one student is enabled for Khanmigo."""
    hasKADAiGuideEnrolledStudents: Boolean! @requires(fields: "descriptor")

    """Is this classroom synced from Clever Library"""
    isCleverLibrarySynced: Boolean! @requires(fields: "descriptor")

    """CDI of a classroom"""
    classroomDistrictInfo: ClassroomDistrictInfo @requires(fields: "descriptor")

    """How many students this classroom's district roster holds, whether or not
    they have activated a Khan Academy account yet.
    Null when this isn't a district classroom.
    """
    countDistrictRosteredStudents: Int @requires(fields: "descriptor")

    """If the classroom was rostered by a district.
    Note that if you are checking for classroom editing permissions,
    you should use `includesCentrallyOwnedDistrictData` instead.
    """
    includesDistrictOwnedData: Boolean! @requires(fields: "descriptor")

    """If the classroom was rostered by a district via a centralized 3rd party roster source (Clever, Classlink, etc),
    as opposed to teacher-directed rostering.
    Controls what a teacher can edit about the classroom.
    """
    includesCentrallyOwnedDistrictData: Boolean! @requires(fields: "descriptor")

    """If the classroom is include in the KMap offering. Controls features and branding."""
    isKmapClassroom: Boolean! @requires(fields: "descriptor")

    """If the classroom is included in the Khan District offering.  Controls features and branding."""
    isK4dClassroom: Boolean! @requires(fields: "descriptor")

    """A coach request made for Clever Library students and teachers.
    When a teacher logs into Khan Academy through Clever Library, we get their roster data from Clever
    through Clever's API. CleverCoachRequests are used to represent the students in a teachers
    class before those students have logged in and joined the class.
