"""
GoalDatum represents a student's Kmap test score for a single strand.

We currently support 4 math strands from the kmap test. Each of those
strands maps to one of 10 KA courses.  We use the ritScore to suggest which
bandKey (aka grade level) of those 10 matching KA courses to suggest for the
student.
"""
type GoalDatum {
    """NWEA's test result ID + unique key for this goal strand"""
    id: ID!

    """The student's test score for the strand"""
    ritScore: Int

    """The unique key. For example Geometry has the strandKey x53ab """
    strandKey: String!

    """The BandKey this ritScore best matches"""
    suggestedRitScoreBandKey: String
}

