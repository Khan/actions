"""
Options for the create district mutation
"""
input CreateDistrictOptions {
    """name: Name of the district. Must be unique"""
      name: String!

      """Types of district - can be more than one offering/type"""
      offerings: [Offering!]!

      """RosterID - currently support either a
      CleverID.    Ex: 501bf6b9093e10027a003ada or
      ClassLinkID. Ex Ex: 1814
      """
      rosterID: String!

      """Roster source - must be a supported type!"""
      rosterSource: RosterSource!

      """The NWEA BID Only for MAP districts. Ex: 07b1c7c9-d508-4715-b25a-b2cdb2656efa"""
      nweaID: String

      """National Center for Education Statistics or (NCES) ID (if applicable to this district) ex: 404230"""
      ncesID: String

      """Flag indicating if test district"""
      isTest: Boolean!

      """Send Teacher and Admin Activation emails.
      If this district allows us to send teachers and admin welcome activation
      emails, this should be set.  If not provided the default is True.
      """
      sendTeacherActivationEmails: Boolean

      """The first date this district is set to start activating.
      Once this is set we will auto activate any unactivated rostered teachers and admins.
      If this districts sends teacher and admin activation emails, emails
      will be sent to all teacher and admins on the first roster after the
      go live date.
      Can be set or updated from devadmin/districts anytime before the goLiveDate.
      """
      goLiveDate: Date

      """The locale for this district"""
      kaLocale: String = "en"

      """The school year start and end dates for this district"""
      schoolYearDates: DistrictSchoolYearInput

      """ True if the district should ignore enrollment Start/End Dates for this District """
      ignoreEnrollmentDates: Boolean

      """ The region of this district. Adheres to ISO-3166. For example US Michigan would be: US-MI """
      region: String

      """The ISO-3166 country code of this district. Should be consistent with `region`."""
      countryCode: String! = "US"

      """ The district-wide preferences for khanmigo enrollment """
      khanmigoPreference: KhanmigoEnrollment

      """ The district-wide preference for khanmigo student enrollment """
      khanmigoIncludeStudents: Boolean

      """Option to turn off non-severe Khanmigo moderation email notifications
      to teachers.
      """
      onlySevereAIModeration: Boolean

      """Flag indicating that the district opted out of being part of research metrics"""
      researchOptOut: Boolean

      """True if the district has LMS integration enabled."""
      hasLMSConnect: Boolean @deprecated(reason: "set `lmsProviderId`; use `rosterID` for Clever")

      """The Date when LMS integration sync should start."""
      lmsConnectStartDate: Date

      """Provider ID enabling LMS integration for a district.
      Clever districts use the roster ID (CleverID).
      Classlink districts use an Ednition datasource ID.
      """
      lmsProviderId: String

      """Datasource ID for the LMS provider's rostering API, used to resolve
      classroom and user IDs. The provider issues a different identifier per
      API, so this is not interchangeable with lmsProviderId. Required on
      ClassLink districts: clearing it leaves the integration unreachable, so
      the activation date is cleared with it.
      """
      lmsRosterDatasourceId: String

      """ The partnership ID that the district should belong to. """
      partnershipID: String

      """LMS syncing defaults for classrooms in the district."""
      lmsSyncType: DistrictLMSSyncType
}

