"""
ClassroomDistrictInfo objects represent a district class from the districts roster.

This CDI is created or updated during rostering. Once the teacher referenced
by the teacherUserDistrictInfo has been activated (linked to a KA account)
a Classroom is created and both the teacher kaid and classroom ID are added
to the CDI.

If the classroom is removed from the roster, we will delete the linked
classroom for this teacher kaid and mark the CDI as soft deleted.
"""
type ClassroomDistrictInfo @key(fields: "id") {
    """ID of a type representing a classroom from a district's roster.
    This may be thought of as a "placeholder" for a classroom that will
    become actualized when the UserDistrictInfo of the teacher of this class
    becomes actualized into a UserData. This type also contains all
    district-owned data about a district-owned classroom.
    """
    id: ID!

    """The Datastore key UUID string for this ClassroomDistrictInfo entity"""
    keyNameID: String!

    """Timestamp this CDI entity was created"""
    createdAt: DateTime

    """Timestamp this CDI was last updated"""
    updatedAt: DateTime

    """Identifier of a CDI that is provided by the school district."""
    districtProvidedIdentifier: String

    """Is this CDI created for use in the MAP product?"""
    isNweaMapSynced: Boolean!

    """Name of the classroom provided by the district."""
    name: String

    """The method that this CDI was rostered. nwea_map vs clever"""
    rosterSource: String

    """The school associated with this CDI."""
    school: School!

    """The classroom the CDI has been realized into."""
    classroom: Classroom

    """The district this CDI belongs in"""
    district: District

    """A list of UDIs who are enrolled in this classroom sorted by displayNameForTeacher"""
    studentUserDistrictInfos(
        """Filters for classroom user district infos"""
        filters: ClassroomUserDistrictInfoFilters,
    ): [UserDistrictInfo]

    """The teacher UDI for this CDI."""
    teacherUserDistrictInfo: UserDistrictInfo

    """The UDIs of all teachers associated with this classroom district
    includes primary teacher id and all co-teachers
    """
    teacherUserDistrictInfos: [UserDistrictInfo!]

    teacherUserDistrictInfoIDs: [UserDistrictInfo!] @deprecated(reason: "use `teacherUserDistrictInfos` instead")

    """The complete list of grade levels for all the district students rostered for this class."""
    studentGradeLevels: [String!]!

    """The number of days until this class will be removed or 0 if already
    deleted or the class is not slated to be deleted
    """
    classWillBeRemovedInDays: Int!

     """The optional number of the district SIS course associated with this classroom"""
    courseSISNumber: String

    """The optional name of the district SIS course associated with this classroom"""
    courseSISName: String

    """The district SIS ID for this this classroom"""
    sectionSIS: String

    """Optonal subject string provided by the district.
    In Clever it can be one of: arts and music, english/language arts,
    homeroom/advisory, interventions/online learning, language, math,
    PE and health, science, social studies,
    technology and engineering, or other.
    The misspelling is by design to avoid the heavy hand of our linter
    """
	sisSubjct: String

    """The list of curriculum aligned courses the district has associated with
    this classroom.  Note it returns an empty list if this classroom is not
    a district classroom or if this district classroom doesn't have any
    curriculum aligned courses associated with it.
    """
    customCourses: [Course!]

    """If the CDI's underlying classroom was manually unmarked as a district
    classroom. This applies only to CDIs with roster source "teacher-directed".
    """
    isManuallyUnmarked: Boolean!

    """A list of incurred changes end users have made on a CDI"""
    cdiAuditLogs: [CDIAuditLog!]

    """Boolean that defines if a teacher changed the classroom name."""
    hasTeacherChangedName: Boolean!

    """The grade level the teacher has set for this classroom.
    This applies only to CDIs with roster source "teacher-directed".
    """
    teacherDirectedGrade: DistrictGradeLevelInfo

    """Whether this classroom has access to the KAD Self-Serve product offering."""
    hasKadSelfServe: Boolean!

    """Whether this classroom has access to the KAD Trial product offering."""
    hasKadTrial: Boolean!

    """Assignment types to sync to LMS for this classroom."""
    lmsSync: [ClassroomLMSSyncType!]!

    """Whether this classroom has auto assign placement turned on"""
    hasAutoAssignLearningPathsPlacements: Boolean!
}

"""
Display info for a classroom, for use in leaderboards etc.

Service-admin batch query only; no per-entity auth.
"""
type ClassroomDisplayInfo {
    """CDI id (urlsafe key)."""
    cdiId: ID!

    """Classroom name from the district roster."""
    className: String

    """School name."""
