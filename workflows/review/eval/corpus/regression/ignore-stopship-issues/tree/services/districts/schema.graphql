    teacher-directed case.
    district cleverID for syncing with clever or
    district classlinkID for syncing with classlink or
    district ExternalID for syncing with BigQuery in the teacher-directed case.
    example cleverID: 612d20f54e91a41b069920cb
    example classlinkID: 1814
    example ExternalID: b85dc9f73023dca1b9fb41828fbca89a1b10d022d9facb5a354c8069754fc7e8
    """
    rosterID: String!

    """Roster source - must be a supported type!"""
    rosterSource: RosterSource!

    """If the district is centrally rostered"""
