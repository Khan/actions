    ): [KadssSelfServeOrganization!]!

    """Whether this user belongs to at least one MAP customer district.
    This is a copy of User.includesKmapDistrictOwnedData; it's included here
    for the use of ACLs, which want to avoid the extra hop to look up the user.
    NOTE(benkraft): For ACLs, this should be queried as a service admin, to
    avoid having to resolve further ACLs.
    TODO(benkraft): Figure out what should and shouldn't be on user, and
    consolidate whether this belongs here or there.
    """
    userIncludesKmapDistrictOwnedData(kaid: String!): Boolean!

    """Uses the transfer token to connect to Clever's API and return
    the users Clever ID.
    This query is used when re-authenticating with Clever. Once a user
    logs back in through Clever we get their Clever ID from Clever's API.
    This allows us to confirm the user's Khan account is associated
    with their Clever ID.
    The transfer token is a reference to a users Clever access token that is
