    rights over all of that given admin's schools.
    Optionally, specify a districtID to filter the results to only include admin UDIs
    rostered to that district.
    Optionally, specify a scopeNodeID (a district or meta-district) to filter the
    results to only include the admin UDIs rostered to a district at or below that
