# Review live A/B — real-model arm-to-arm evals for review-bot changes.
#
# A PR touching workflows/review/** runs the model sub-agents from BOTH the
# base branch's review.md (baseline) and the PR's review.md (candidate) over
# the live-enabled corpus subset, then posts the delta report (five live
# metrics, judge quality, cost, regressions) as a sticky PR comment and job
# summary. See workflows/review/eval/live-ab-plan.md for the full design.
#
# Why the base TIP and not the merge-base: on pull_request events the
# checkout is the PR merge commit, so the candidate tree already contains the
# base tip. Baselining on the same tip means the two arms differ only by the
# PR's own review.md changes; a merge-base baseline would fold any upstream
# review.md movement into the PR's measured delta.
#
# Quality deltas are report-only. Adversarial failures and incomplete shard
# coverage fail the workflow, preserving partial artifacts for inspection.
#
# Cost control: per-PR runs cover only the live cases also tagged `smoke`;
# a `full-eval` label lifts that to every live development case (reserved
# holdouts stay excluded). Smoke gets $40 total across both arms, full gets
# $200 split across four parallel paired shards. Smoke stays single-job.
# The runner checks each arm's budget between cases, so a dispatch can
# overshoot its slice. Judge, arbiter, and gate retries add spend outside that
# budget. A new push cancels a superseded run (concurrency below). A
# `skip-live-eval` label skips the job entirely (added mid-run, it cancels
# the in-flight run too, see the concurrency key).
#
# NOTE: this workflow's name must stay distinct from any gh-aw workflow a
# consumer runs (same-named workflows share a gh-aw concurrency group per PR
# and cancel each other; see the round-two doc's operational floor).

name: Review Eval A/B

on:
  pull_request:
    # `labeled` is here so adding `full-eval` triggers the lifted run
    # immediately instead of waiting for the next push; the job-level guard
    # below ignores every other label.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - "workflows/review/**"
      - ".github/workflows/review-eval-ab.yml"
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Baseline ref, resolved once before sharding (default: PR base commit or origin/main)"
        required: false
      max_usd:
        description: "Dispatch budget across both arms and all repeats, checked between cases (blank: smoke 40, full 200)"
        required: false
        default: ""
      full:
        description: "Run every live development case (not just smoke, reserved holdouts stay excluded)"
        type: boolean
        required: false
        default: false
      cases:
        description: "Comma-separated live case ids (targeted repeats; default: all selected cases)"
        required: false
      repeats:
        description: "Repeats per arm in this one dispatch; >1 reports pooled pass rates with binomial intervals"
        required: false
        default: "1"
      shards:
        description: "Parallel case shards, 1 to 16 (blank: full 4, smoke 1)"
        required: false
        default: ""
      force_arms:
        description: "Run both arms even when review.md is byte-identical (wobble control / noise floor)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# A `labeled` event for any label other than `full-eval` runs nothing (every
# job's `if` skips it), but until this key sent it to its own group it still
# cancelled the PR's in-flight A/B: run 33802457289 lost 45 minutes and its
# spend to a `skip-ai-review` label added mid-run. A no-op event must never
# share a group with a live one. `skip-live-eval` is the one exception: it is
# the opt-out, and adding it mid-run is how a run that is burning budget gets
# stopped from inside the repo, so it stays in the live group and cancels
# (the run's per-case checkpoint keeps what it had scored).
concurrency:
  group: review-eval-ab-${{ github.event.pull_request.number || github.run_id }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'full-eval' && github.event.label.name != 'skip-live-eval') && 'noop' || 'live' }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Pin sources and plan eval shards
    runs-on: ubuntu-latest
    # Drafts wait until ready; the changeset release PR matches the path
    # filter (it bumps workflows/review/package.json) but changes no
    # behavior; skip-live-eval opts a PR out.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.head_ref != 'changeset-release/main' &&
       !contains(github.event.pull_request.labels.*.name, 'skip-live-eval') &&
       (github.event.action != 'labeled' ||
        github.event.label.name == 'full-eval'))
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      candidate_sha: ${{ steps.plan.outputs.candidate_sha }}
      enabled: ${{ steps.plan.outputs.enabled }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # The baseline arm reads review.md from the base ref via
          # `git show`, so the full history is needed.
          fetch-depth: 0
      - uses: ./actions/shared-node-cache
      - name: Plan the live A/B
        id: plan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # The tip of the PR's base branch (see the header comment for why
          # tip, not merge-base). workflow_dispatch may override it.
          BASE_REF: ${{ inputs.base_ref || github.event.pull_request.base.sha || 'origin/main' }}
          MAX_USD: ${{ inputs.max_usd || '' }}
          FULL_EVAL: ${{ inputs.full == true || contains(github.event.pull_request.labels.*.name, 'full-eval') }}
          SHARDS: ${{ inputs.shards || '' }}
          CASES: ${{ inputs.cases || '' }}
          REPEATS: ${{ inputs.repeats || '1' }}
          FORCE_ARMS: ${{ inputs.force_arms == true }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY secret not configured; skipping the live A/B." >&2
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SCOPE=(--smoke-only)
          DEFAULT_MAX_USD=40
          if [ "$FULL_EVAL" = "true" ]; then
            SCOPE=()
            # Run 34381736297 spent $40.38 on 43 case-arm runs. At that
            # rate, 66 cases across both arms need $124. The $200 budget
            # leaves room for the unmeasured tail without raising smoke.
            DEFAULT_MAX_USD=200
          fi
          MAX_USD="${MAX_USD:-$DEFAULT_MAX_USD}"
          echo "Live A/B: full=$FULL_EVAL, dispatch budget=$MAX_USD USD across both arms and all repeats"
          EXTRA=()
          if [ -n "$CASES" ]; then
            EXTRA+=(--cases "$CASES")
          fi
          if [ "$REPEATS" != "1" ]; then
            EXTRA+=(--repeats "$REPEATS")
          fi
          if [ -n "$SHARDS" ]; then
            EXTRA+=(--shards "$SHARDS")
          fi
          if [ "$FORCE_ARMS" = "true" ]; then
            EXTRA+=(--force-arms)
          fi
          pnpm dlx tsx workflows/review/eval/live-ab-shard-cli.ts plan \
            --base-ref "$BASE_REF" --max-usd "$MAX_USD" "${SCOPE[@]}" "${EXTRA[@]}"
      - name: Prove the read scope bites
        if: steps.plan.outputs.enabled == 'true'
        # One Haiku call: an in-scope Read must succeed and an out-of-scope
        # Read must be denied, on the SDK version this checkout installs. A
        # runner that lets a reviewer read the corpus produces recall numbers
        # that are not recall numbers, so this fails the job before any arm
        # spends.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY secret not configured; skipping the probe." >&2
            exit 0
          fi
          pnpm dlx tsx workflows/review/eval/live-runner.ts --probe-read-scope \
            --transcripts-dir "$RUNNER_TEMP/review-transcripts"
      - name: Upload the shard plan
        if: steps.plan.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-ab-plan
          path: out/live-ab-plan.json
          if-no-files-found: error
      - name: Upload scope probe transcripts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-ab-transcripts-probe
          path: ${{ runner.temp }}/review-transcripts
          if-no-files-found: ignore

  live-ab:
    name: Live A/B shard ${{ matrix.id }}
    needs: prepare
    if: needs.prepare.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    strategy:
      # A failed shard must not cancel peers that have already spent money.
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: ./actions/shared-node-cache
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: live-ab-plan
          path: out
      - name: Run the paired shard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHARD_ID: ${{ matrix.id }}
        run: |
          pnpm dlx tsx workflows/review/eval/live-ab-shard-cli.ts run \
            --shard "$SHARD_ID" --transcripts-dir "$RUNNER_TEMP/review-transcripts"
      - name: Upload shard checkpoint and receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-ab-shard-${{ matrix.id }}
          path: out/shards/live-ab-shard-${{ matrix.id }}/
          if-no-files-found: error
      - name: Upload shard transcripts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-ab-transcripts-${{ matrix.id }}
          path: ${{ runner.temp }}/review-transcripts
          if-no-files-found: ignore

  report:
    name: Merge paired eval shards
    needs: [prepare, live-ab]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
      - uses: ./actions/shared-node-cache
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: live-ab-plan
          path: out
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: live-ab-shard-*
          path: out/shards
      - name: Merge reports and enforce coverage
        if: always()
        run: pnpm dlx tsx workflows/review/eval/live-ab-shard-cli.ts merge
      - name: Upload the report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-ab-report
          path: out/live-ab-report.*
          if-no-files-found: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: always()
        with:
          pattern: live-ab-transcripts-*
          path: ${{ runner.temp }}/review-transcripts
          merge-multiple: true
      - name: Upload combined transcripts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-ab-transcripts
          path: ${{ runner.temp }}/review-transcripts
          if-no-files-found: ignore
      - name: Post the sticky PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require("fs");
            const path = "out/live-ab-report.md";
            if (!fs.existsSync(path)) {
              core.info("no report markdown; nothing to post");
              return;
            }
            const marker = "<!-- review-eval-ab -->";
            const body = `${marker}\n${fs.readFileSync(path, "utf8")}`;
            const {owner, repo} = context.repo;
            const issue_number = context.payload.pull_request.number;
            const current = await github.rest.pulls.get({owner, repo, pull_number: issue_number});
            if (current.data.head.sha !== context.payload.pull_request.head.sha) {
              core.info("superseded run, leaving the current PR comment alone");
              return;
            }
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {owner, repo, issue_number, per_page: 100},
            );
            const prior = comments.find((c) => c.body?.startsWith(marker));
            if (prior) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: prior.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
