name: Fix Workflows
description: >-
    Validates GitHub Actions workflow YAML files, auto-fixing
    checkout-followed-by-setup and (when check-runs-on is true) checking
    every runs-on value against an allowlist, then formats them with oxfmt.
    A `# fix-workflows-ignore` comment on a `runs-on:` line or a checkout step
    opts that job/step out of the check.
inputs:
    check-runs-on:
        description: >-
            Whether to check every runs-on value against the allowed-runs-on
            list in config-file. Off by default. Replaces the pre-v4
            fix-runs-on input; a value not on the list is reported and fails
            the run, not rewritten.
        required: false
        default: "false"
    fix-runs-on:
        description: >-
            Deprecated alias for check-runs-on, kept so a pre-v4 caller's
            `fix-runs-on: true` still turns the check on. The check is on when
            either input is true.
        deprecationMessage: >-
            fix-runs-on is deprecated: use check-runs-on. It no longer rewrites
            runs-on values; it only checks them against allowed-runs-on.
        required: false
        default: "false"
    config-file:
        description: >-
            Path, relative to the repo root, of a YAML file whose
            `allowed-runs-on` key lists the exact runs-on values workflows may
            use, copied as they appear in the workflows. When empty,
            .github/fix-workflows.yml is used if it exists. With no file or no
            list, the only allowed value is
            `${{ vars.USE_GITHUB_RUNNERS == 'true' && 'ubuntu-latest' || 'ephemeral-runner' }}`.
            A path given here must exist.
        required: false
        default: ""
    setup-action:
        description: >-
            The action that must immediately follow every checkout step.
            Can be a remote action name (e.g. Khan/actions@secure-network-v1)
            or a local path (e.g. ./.github/actions/setup). When a local path
            is given, that action's own file is excluded from validation.
        required: false
        default: Khan/actions@secure-network-v1
runs:
    using: "composite"
    steps:
        - name: Fix workflow violations
          id: fix
          uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
          # String inputs reach the script through the environment rather than
          # being spliced into its source, where a quote or `${` would run as JS.
          env:
              CONFIG_FILE: ${{ inputs.config-file }}
              SETUP_ACTION: ${{ inputs.setup-action }}
          with:
              script: |
                  try {
                      await require('./actions/fix-workflows/index.js').default({
                          core,
                          checkRunsOn: ${{ inputs.check-runs-on == 'true' || inputs.fix-runs-on == 'true' }},
                          configFile: process.env.CONFIG_FILE,
                          setupAction: process.env.SETUP_ACTION,
                      })
                      // A run that finds violations still gets here (it calls
                      // setFailed rather than throwing); a crash doesn't.
                      core.setOutput('completed', 'true')
                  } catch (err) {
                      core.setFailed(err.message)
                  }

        # Without the negations this step reformats compiler output that the YAML
        # fixer above correctly skips, which desyncs a committed lock from `gh aw
        # compile` and makes the next step annotate a generated file with a fix
        # nobody should apply. `ignorePatterns` in .oxfmtrc.json cannot do this: the
        # config lives in the action's directory, not the repo being formatted, and
        # its patterns do not resolve against the working directory.
        #
        # A bash step cannot import the TypeScript, so these literals are a copy of
        # `generatedWorkflowSkipGlobs()` in index.ts; generated-workflows.test.ts
        # fails if they drift from it.
        #
        # The `if:` here and below: a runs-on violation fails the step above,
        # but any setup-step fixes it made still need formatting and a hint,
        # since the hint is how a caller learns to apply them. `completed` is
        # only set when the fixer ran to the end, so a crash still skips both
        # steps instead of formatting files the fixer never looked at.
        - name: Format YAML files with oxfmt
          if: ${{ !cancelled() && steps.fix.outputs.completed == 'true' }}
          shell: bash
          run: |
              npx --yes oxfmt@0.44.0 --write \
                --config "${{ github.action_path }}/.oxfmtrc.json" \
                ".github/workflows/**/*.yml" \
                '!.github/workflows/**/*.lock.yml' \
                '!.github/workflows/**/agentics-maintenance.yml'

        - name: Show fix instructions
          if: ${{ !cancelled() && steps.fix.outputs.completed == 'true' }}
          shell: bash
          env:
              CHECK_RUNS_ON: ${{ inputs.check-runs-on == 'true' || inputs.fix-runs-on == 'true' }}
              CONFIG_FILE: ${{ inputs.config-file }}
              SETUP_ACTION: ${{ inputs.setup-action }}
          run: |
              if git diff --quiet .github/workflows/; then
                echo "No setup-step fixes to apply."
              else
                MAJOR_VERSION=$(node -p "require('${{ github.action_path }}/package.json').version.split('.')[0]")
                TAG="fix-workflows-v${MAJOR_VERSION}"
                # The options "Fix workflow violations" ran with, as the flags
                # parseCliArgs reads, so the local command does the same.
                ARGS=""
                if [[ "$CHECK_RUNS_ON" == "true" ]]; then
                  ARGS+=" --check-runs-on"
                fi
                if [[ -n "$CONFIG_FILE" ]]; then
                  ARGS+=" --config-file $(printf '%q' "$CONFIG_FILE")"
                fi
                ARGS+=" --setup-action $(printf '%q' "$SETUP_ACTION")"
                CMD="pnpm dlx github:Khan/actions#${TAG}${ARGS}"
                HINT="Or add a '# fix-workflows-ignore' comment to the checkout step to opt out."
                for file in $(git diff --name-only .github/workflows/); do
                  echo "::warning file=${file}::This file needs updating. Run: ${CMD} ${HINT}"
                done
              fi
